<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bootstrap Modal Practice</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="p-5">

  <!-- 🔹 Basic Modal Trigger -->
  <button type="button" class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#basicModal">
    Launch demo modal
  </button>

  <!-- 🔹 Basic Modal -->
  <div class="modal fade" id="basicModal" tabindex="-1" aria-labelledby="basicModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="basicModalLabel">Modal title</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          This is a basic Bootstrap modal.
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-primary">Save changes</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 🔹 Modal with Grid Layout -->
  <button type="button" class="btn btn-success mb-3" data-bs-toggle="modal" data-bs-target="#gridModal">
    Launch modal with grid
  </button>

  <div class="modal fade" id="gridModal" tabindex="-1" aria-labelledby="gridModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg"> <!-- Larger modal for grid -->
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="gridModalLabel">Grid Layout</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="container-fluid">
            <div class="row">
              <div class="col-md-4 bg-light border">.col-md-4</div>
              <div class="col-md-4 ms-auto bg-light border">.col-md-4 .ms-auto</div>
            </div>
            <div class="row mt-2">
              <div class="col-md-3 ms-auto bg-light border">.col-md-3 .ms-auto</div>
              <div class="col-md-2 ms-auto bg-light border">.col-md-2 .ms-auto</div>
            </div>
            <div class="row mt-2">
              <div class="col-md-6 ms-auto bg-light border">.col-md-6 .ms-auto</div>
            </div>
            <div class="row mt-2">
              <div class="col-sm-9 bg-light border">
                Level 1: .col-sm-9
                <div class="row mt-2">
                  <div class="col-8 col-sm-6 bg-white border">Level 2: .col-8 .col-sm-6</div>
                  <div class="col-4 col-sm-6 bg-white border">Level 2: .col-4 .col-sm-6</div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 🔹 Varying Content Modals -->
  <h5 class="mt-4">Open modal with varying content:</h5>
  <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#variableModal" data-bs-whatever="@mdo">Open for @mdo</button>
  <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#variableModal" data-bs-whatever="@fat">Open for @fat</button>
  <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#variableModal" data-bs-whatever="@getbootstrap">Open for @getbootstrap</button>

  <!-- Modal for Varying Content -->
  <div class="modal fade" id="variableModal" tabindex="-1" aria-labelledby="variableModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="variableModalLabel">New message</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form>
            <div class="mb-3">
              <label for="recipient-name" class="col-form-label">Recipient:</label>
              <input type="text" class="form-control" id="recipient-name" />
            </div>
            <div class="mb-3">
              <label for="message-text" class="col-form-label">Message:</label>
              <textarea class="form-control" id="message-text"></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-primary">Send message</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Script for dynamic content -->
  <script>
    const variableModal = document.getElementById('variableModal');
    variableModal.addEventListener('show.bs.modal', event => {
      const button = event.relatedTarget;
      const recipient = button.getAttribute('data-bs-whatever');
      const modalTitle = variableModal.querySelector('.modal-title');
      const recipientInput = variableModal.querySelector('#recipient-name');

      modalTitle.textContent = `New message to ${recipient}`;
      recipientInput.value = recipient;
    });
  </script>

</body>
</html>
